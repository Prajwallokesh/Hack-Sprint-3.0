<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 480" width="100%" height="100%">
  <!-- Background with ink border -->
  <rect width="400" height="480" rx="8" fill="#FFFFFF" stroke="#0A0A0A" stroke-width="3"/>
  
  <!-- Google 4-Color Top Strip -->
  <rect x="0" y="0" width="100" height="6" fill="#4285F4"/>
  <rect x="100" y="0" width="100" height="6" fill="#EA4335"/>
  <rect x="200" y="0" width="100" height="6" fill="#FBBC04"/>
  <rect x="300" y="0" width="100" height="6" fill="#34A853"/>

  <!-- Header Banner -->
  <rect x="20" y="22" width="360" height="52" rx="4" fill="#E8F0FE" stroke="#0A0A0A" stroke-width="2"/>
  <text x="200" y="44" fill="#1967D2" font-family="'Space Mono', monospace" font-size="12" font-weight="bold" text-anchor="middle" letter-spacing="0.5">GEC ARSIKERE &amp; MOSALEHOSAHALLI</text>
  <text x="200" y="62" fill="#0A0A0A" font-family="'Outfit', sans-serif" font-size="14" font-weight="800" text-anchor="middle">REGISTRATION FEE: ₹400</text>

  <!-- QR Frame -->
  <rect x="45" y="88" width="310" height="310" rx="6" fill="#FAFAF9" stroke="#0A0A0A" stroke-width="2"/>
  
  <!-- Stylized QR matrix representation -->
  <g fill="#0A0A0A">
    <!-- Top-Left Finder Pattern -->
    <rect x="70" y="113" width="64" height="64" rx="4" fill="#0A0A0A"/>
    <rect x="80" y="123" width="44" height="44" rx="2" fill="#FFFFFF"/>
    <rect x="88" y="131" width="28" height="28" rx="2" fill="#0A0A0A"/>

    <!-- Top-Right Finder Pattern -->
    <rect x="266" y="113" width="64" height="64" rx="4" fill="#0A0A0A"/>
    <rect x="276" y="123" width="44" height="44" rx="2" fill="#FFFFFF"/>
    <rect x="284" y="131" width="28" height="28" rx="2" fill="#0A0A0A"/>

    <!-- Bottom-Left Finder Pattern -->
    <rect x="70" y="309" width="64" height="64" rx="4" fill="#0A0A0A"/>
    <rect x="80" y="319" width="44" height="44" rx="2" fill="#FFFFFF"/>
    <rect x="88" y="327" width="28" height="28" rx="2" fill="#0A0A0A"/>

    <!-- Timing & Data Modules -->
    <rect x="148" y="118" width="12" height="12"/>
    <rect x="170" y="118" width="12" height="12"/>
    <rect x="192" y="118" width="12" height="12"/>
    <rect x="214" y="118" width="12" height="12"/>
    <rect x="236" y="118" width="12" height="12"/>

    <rect x="148" y="140" width="12" height="12"/>
    <rect x="180" y="140" width="24" height="12"/>
    <rect x="224" y="140" width="12" height="12"/>

    <rect x="148" y="162" width="24" height="12"/>
    <rect x="192" y="162" width="12" height="24"/>
    <rect x="224" y="162" width="24" height="12"/>

    <!-- Center QR Data badge with Neo-Brutalist shadow -->
    <rect x="78" y="200" width="244" height="84" fill="#FFFFFF" stroke="#0A0A0A" stroke-width="2.5" rx="4"/>
    <rect x="74" y="196" width="244" height="84" fill="#4285F4" stroke="#0A0A0A" stroke-width="2.5" rx="4"/>
    <text x="196" y="242" fill="#FFFFFF" font-family="'Outfit', sans-serif" font-size="34" font-weight="900" text-anchor="middle">₹ 400</text>
    <text x="196" y="266" fill="#0A0A0A" font-family="'Space Mono', monospace" font-size="12" font-weight="bold" text-anchor="middle">SCAN &amp; PAY ₹400</text>

    <!-- Bottom Data Modules -->
    <rect x="150" y="315" width="16" height="16"/>
    <rect x="180" y="315" width="16" height="16"/>
    <rect x="210" y="315" width="16" height="16"/>
    <rect x="240" y="315" width="16" height="16"/>
    <rect x="270" y="315" width="16" height="16"/>
    <rect x="300" y="315" width="16" height="16"/>

    <rect x="150" y="345" width="32" height="16"/>
    <rect x="200" y="345" width="16" height="16"/>
    <rect x="230" y="345" width="32" height="16"/>
    <rect x="280" y="345" width="36" height="16"/>
  </g>

  <!-- Footer Tag -->
  <rect x="20" y="412" width="360" height="52" rx="4" fill="#F5F3EE" stroke="#0A0A0A" stroke-width="2"/>
  <text x="200" y="433" fill="#0A0A0A" font-family="'Space Mono', monospace" font-size="12" font-weight="bold" text-anchor="middle">UPI: hacksprint.gec@upi</text>
  <text x="200" y="451" fill="#4A4844" font-family="'Outfit', sans-serif" font-size="12" font-weight="600" text-anchor="middle">GPay &bull; PhonePe &bull; Paytm &bull; BHIM</text>
</svg>
